name: tests

# The suites nothing was running. A contract test asserting a marker in a skill
# file broke in PR #277 and stayed broken through three later pull requests,
# because no workflow ran it. Everything listed here is green on master and
# blocking; the wider katagami-curation contract suite is not here because it
# carries failures that predate this workflow.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - name: Every source ledger validates
        run: node scripts/encyclopedia-coverage.mjs

  writing-style-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest tests.test_writing_style_contract -v
        working-directory: katagami-curation
