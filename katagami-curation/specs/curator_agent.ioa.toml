# CuratorAgent — expected curator *conduct* on the live Katagami app.
#
# This machine encodes what we expect the agent to DO, the same acts as
# research-direction and synthesize-language. It is not a second pipeline
# and not a job-status ledger.
#
# The live objects stay themselves:
#   CurationQuery, CurationDirection, CurationJob, DesignLanguage, DesignSource
# The agent still calls SpawnDirection / CompleteResearch / SetSpec /
# SubmitForReview / CompleteSynthesis on those objects. This ledger is the
# ordered behavior we will judge: take the query, search the web, index
# sources, derive directions; then take the direction, author the language,
# author the surfaces, render, look, fix, submit.
#
# Cross-entity guards are the join to the app. Behavior without the matching
# object state is refused.
#
# This phase: source_search + synthesize only (D24).
#
# Research:
#   Idle -> ReadingQuery -> Searching -> SourcesReady -> DirectionsReady -> Idle
# Synthesize:
#   Idle -> ReadingDirection -> LanguageReady -> SurfacesReady
#        -> SurfacesRendered -> RendersSeen -> LanguageUnderReview -> Idle
#   RendersSeen -> SurfacesReady   (FixSurfaces — look-fix, max 12)
# Working states -> Abandoned

[automaton]
name = "CuratorAgent"
states = [
  "Idle",
  "ReadingQuery",
  "Searching",
  "SourcesReady",
  "DirectionsReady",
  "ReadingDirection",
  "LanguageReady",
  "SurfacesReady",
  "SurfacesRendered",
  "RendersSeen",
  "LanguageUnderReview",
  "Abandoned",
]
initial = "Idle"
allow_indefinite_states = ["Idle", "Abandoned"]

[[state]]
name = "session_id"
type = "string"
initial = ""

[[state]]
name = "trajectory_id"
type = "string"
initial = ""

[[state]]
name = "spec_version"
type = "string"
initial = ""

[[state]]
name = "harness"
type = "string"
initial = ""

[[state]]
name = "capture_recorded"
type = "bool"
initial = "false"

[[state]]
name = "job_id"
type = "string"
initial = ""

[[state]]
name = "query_id"
type = "string"
initial = ""

[[state]]
name = "direction_id"
type = "string"
initial = ""

[[state]]
name = "design_language_id"
type = "string"
initial = ""

[[state]]
name = "searches_run"
type = "counter"
initial = 0

[[state]]
name = "sources_indexed"
type = "counter"
initial = 0

[[state]]
name = "directions_derived"
type = "counter"
initial = 0

[[state]]
name = "revision_rounds"
type = "counter"
initial = 0

[[state]]
name = "abandon_reason"
type = "string"
initial = ""

# ============================================================================
# Idle
# ============================================================================

[[action]]
name = "RecordCapture"
kind = "input"
from = ["Idle"]
params = ["session_id", "trajectory_id", "spec_version", "harness"]
guard = [{ type = "is_false", var = "capture_recorded" }]
effect = [{ type = "set_bool", var = "capture_recorded", value = "true" }]
hint = "Store how this run will be found. One-shot. Not work yet."

[[action]]
name = "TakeQuery"
kind = "input"
from = ["Idle"]
to = "ReadingQuery"
params = ["job_id", "query_id"]
guard = [
  { type = "is_true", var = "capture_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Running"], required = true },
  { type = "cross_entity_state", entity_type = "CurationQuery", entity_id_source = "query_id", required_status = ["Researching"], required = true },
]
hint = "Take the live query. The source_search job is already Running and the query is Researching. The next act is to search the web, not to invent a direction on this ledger."

# ============================================================================
# Research conduct — same order as research-direction
# ============================================================================

[[action]]
name = "SearchTheWeb"
kind = "input"
from = ["ReadingQuery", "Searching"]
to = "Searching"
params = ["search_notes"]
guard = [{ type = "max_count", var = "searches_run", max = 4 }]
effect = [{ type = "increment", var = "searches_run" }]
hint = "Search the web for movements and sources. Matches research-direction steps 3–4: varied focused queries, then a shortlist. Bounded at four searches for a targeted job."

[[action]]
name = "IndexSources"
kind = "input"
from = ["Searching", "SourcesReady"]
to = "SourcesReady"
params = ["source_notes"]
guard = [
  { type = "min_count", var = "searches_run", min = 1 },
  { type = "max_count", var = "sources_indexed", max = 8 },
]
effect = [{ type = "increment", var = "sources_indexed" }]
hint = "Index a source as a DesignSource on the commons. The create/Submit/Index calls live on DesignSource. This records that the agent actually did that work. Cannot run before at least one search."

[[action]]
name = "DeriveDirections"
kind = "input"
from = ["SourcesReady", "DirectionsReady"]
to = "DirectionsReady"
params = ["movement_name"]
guard = [
  { type = "min_count", var = "sources_indexed", min = 1 },
  { type = "max_count", var = "directions_derived", max = 4 },
]
effect = [{ type = "increment", var = "directions_derived" }]
hint = "Derive one direction from the research. The mint is CurationJob.SpawnDirection on the held job — this ledger step is the conduct. Targeted jobs spawn one or two; the bound is four."

[[action]]
name = "CompleteResearch"
kind = "input"
from = ["DirectionsReady"]
to = "Idle"
guard = [
  { type = "min_count", var = "directions_derived", min = 1 },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Finalizing", "Completed"], required = true },
]
hint = "Stop researching only after at least one direction was derived and CurationJob.CompleteResearch has already committed. Completing with zero directions is the empty-fan-out fail on the job, not a success here."

# ============================================================================
# Synthesize conduct — same order as synthesize-language
# ============================================================================

[[action]]
name = "TakeDirection"
kind = "input"
from = ["Idle"]
to = "ReadingDirection"
params = ["job_id", "query_id", "direction_id"]
guard = [
  { type = "is_true", var = "capture_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Running"], required = true },
  { type = "cross_entity_state", entity_type = "CurationDirection", entity_id_source = "direction_id", required_status = ["Synthesizing"], required = true },
]
hint = "Take the direction the pipeline queued. Read the brief from that CurationDirection before authoring a language."

[[action]]
name = "AuthorLanguage"
kind = "input"
from = ["ReadingDirection"]
to = "LanguageReady"
params = ["design_language_id"]
guard = [
  { type = "cross_entity_state", entity_type = "DesignLanguage", entity_id_source = "design_language_id", required_status = ["Draft"], required = true },
]
hint = "Author the language from the direction: one ownable idea, tokens, rules. The write is DesignLanguage.SetSpec / SubmitDesignLanguage. This step is the conduct — a page without a language first is a caption."

[[action]]
name = "AuthorSurfaces"
kind = "input"
from = ["LanguageReady", "SurfacesReady"]
to = "SurfacesReady"
params = ["surface_notes"]
hint = "Author the three surfaces — landing, embodiment, dashboard — from that language. File writes live on DesignLanguage. Arriving here from a fix means the previous look is dead."

[[action]]
name = "RenderSurfaces"
kind = "input"
from = ["SurfacesReady"]
to = "SurfacesRendered"
params = ["render_notes"]
hint = "Render the current bytes in a real browser. This produces evidence. It is not looking."

[[action]]
name = "LookAtRenders"
kind = "input"
from = ["SurfacesRendered"]
to = "RendersSeen"
params = ["look_notes"]
hint = "Look at the screenshots as images in context and say what is in them. Writing a PNG is not this. SurfacesRendered and RendersSeen are different facts."

[[action]]
name = "FixSurfaces"
kind = "input"
from = ["RendersSeen"]
to = "SurfacesReady"
params = ["fix_note"]
guard = [{ type = "max_count", var = "revision_rounds", max = 12 }]
effect = [{ type = "increment", var = "revision_rounds" }]
hint = "Fix what the look found. Lands back in SurfacesReady so the only way forward is render then look again. Bounded at twelve (C19)."

[[action]]
name = "SubmitLanguage"
kind = "input"
from = ["RendersSeen"]
to = "LanguageUnderReview"
guard = [
  { type = "cross_entity_state", entity_type = "DesignLanguage", entity_id_source = "design_language_id", required_status = ["UnderReview"], required = true },
]
hint = "Hand the language to review. DesignLanguage.SubmitForReview is the gate; this step is only legal once that entity is already UnderReview. You cannot skip the look: this action is only from RendersSeen."

[[action]]
name = "CompleteSynthesis"
kind = "input"
from = ["LanguageUnderReview"]
to = "Idle"
guard = [
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Finalizing", "Completed"], required = true },
  { type = "cross_entity_state", entity_type = "DesignLanguage", entity_id_source = "design_language_id", required_status = ["UnderReview"], required = true },
]
hint = "Put the synthesize job down only after CurationJob.CompleteSynthesis committed and the language is still UnderReview."

# ============================================================================
# Give up
# ============================================================================

[[action]]
name = "Abandon"
kind = "input"
from = [
  "ReadingQuery",
  "Searching",
  "SourcesReady",
  "DirectionsReady",
  "ReadingDirection",
  "LanguageReady",
  "SurfacesReady",
  "SurfacesRendered",
  "RendersSeen",
  "LanguageUnderReview",
]
to = "Abandoned"
params = ["abandon_reason"]
hint = "End the work and say which act could not be finished."

[[state_timeout]]
state = "ReadingQuery"
after_seconds = 900
on_timeout = "Abandon"
params = { abandon_reason = "Took the query and never searched." }

[[state_timeout]]
state = "Searching"
after_seconds = 1800
on_timeout = "Abandon"
params = { abandon_reason = "Searched and never indexed sources." }

[[state_timeout]]
state = "SourcesReady"
after_seconds = 1800
on_timeout = "Abandon"
params = { abandon_reason = "Indexed sources and never derived a direction." }

[[state_timeout]]
state = "DirectionsReady"
after_seconds = 900
on_timeout = "Abandon"
params = { abandon_reason = "Derived directions and never completed research." }

[[state_timeout]]
state = "ReadingDirection"
after_seconds = 900
on_timeout = "Abandon"
params = { abandon_reason = "Took the direction and never authored a language." }

[[state_timeout]]
state = "LanguageReady"
after_seconds = 3600
on_timeout = "Abandon"
params = { abandon_reason = "Authored a language and never built the surfaces." }

[[state_timeout]]
state = "SurfacesReady"
after_seconds = 1800
on_timeout = "Abandon"
params = { abandon_reason = "Authored surfaces and never rendered them." }

[[state_timeout]]
state = "SurfacesRendered"
after_seconds = 900
on_timeout = "Abandon"
params = { abandon_reason = "Rendered and never looked." }

[[state_timeout]]
state = "RendersSeen"
after_seconds = 3600
on_timeout = "Abandon"
params = { abandon_reason = "Looked and never fixed or submitted." }

[[state_timeout]]
state = "LanguageUnderReview"
after_seconds = 900
on_timeout = "Abandon"
params = { abandon_reason = "Language under review but synthesize job never completed." }

[[invariant]]
name = "RevisionLoopBounded"
assert = "revision_rounds <= 12"

[[invariant]]
name = "SearchBoundHolds"
assert = "searches_run <= 4"

[[invariant]]
name = "SourceBoundHolds"
assert = "sources_indexed <= 8"

[[invariant]]
name = "DirectionBoundHolds"
assert = "directions_derived <= 4"

[[invariant]]
name = "AbandonedIsFinal"
when = ["Abandoned"]
assert = "no_further_transitions"

[[liveness]]
name = "WorkingEventuallyResolves"
from = ["ReadingQuery"]
reaches = ["Idle", "Abandoned"]
