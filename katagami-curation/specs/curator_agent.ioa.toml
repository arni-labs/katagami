# CuratorAgent — one curator principal inside the live Katagami app.
#
# This actor is a slice of the existing pipeline, not a second Katagami.
# CurationQuery, CurationDirection, CurationJob, and DesignLanguage keep
# owning the work objects. This machine owns the curator's CONDUCT while
# working those objects.
#
# The live path this phase:
#   CurationQuery.Submit
#     → source_search CurationJob (Running)
#         → CurationJob.SpawnDirection  (mints CurationDirection)
#         → CurationJob.CompleteResearch
#     → synthesize CurationJob per direction (Running)
#         → DesignLanguage writes + DesignLanguage.SubmitForReview
#         → CurationJob.CompleteSynthesis  (language must already be UnderReview)
#
# The curator principal calls those existing actions. This ledger records
# which query, direction, job, and language it is working, and refuses to
# finish a synthesize hold unless the language is actually UnderReview.
# Publishing is not in this alphabet. Quality review is not in this alphabet.
#
# This phase the job types are source_search and synthesize only
# (D24). organize / evolve / taste stay on CurationJob and on the live
# curator process; they are not accepted here yet.
#
# STATES, NOT FLAGS: Holding research vs holding synthesize are two states.
# job_type is not a boolean on this actor.
#
# Lifecycle:
#   Idle --AcceptResearchJob--> Researching --FinishResearch--> Idle
#   Idle --AcceptSynthesizeJob--> Synthesizing --FinishSynthesize--> Idle
#   Researching | Synthesizing --Abandon--> Abandoned

[automaton]
name = "CuratorAgent"
states = ["Idle", "Researching", "Synthesizing", "Abandoned"]
initial = "Idle"
allow_indefinite_states = ["Idle", "Abandoned"]

# --- Capture identity -------------------------------------------------------

[[state]]
name = "session_id"
type = "string"
initial = ""

[[state]]
name = "trajectory_id"
type = "string"
initial = ""

[[state]]
name = "spec_version"
type = "string"
initial = ""

[[state]]
name = "harness"
type = "string"
initial = ""

[[state]]
name = "capture_recorded"
type = "bool"
initial = "false"

# --- The live entities this run is working ----------------------------------

[[state]]
name = "job_id"
type = "string"
initial = ""

[[state]]
name = "query_id"
type = "string"
initial = ""

[[state]]
name = "direction_id"
type = "string"
initial = ""

[[state]]
name = "design_language_id"
type = "string"
initial = ""

[[state]]
name = "query_recorded"
type = "bool"
initial = "false"

[[state]]
name = "direction_recorded"
type = "bool"
initial = "false"

[[state]]
name = "language_recorded"
type = "bool"
initial = "false"

[[state]]
name = "look_recorded"
type = "bool"
initial = "false"

# Look-fix rounds while synthesizing. The language entity owns the bytes
# and SubmitForReview; this counter is the curator's own revision loop (C19).
[[state]]
name = "revision_rounds"
type = "counter"
initial = 0

[[state]]
name = "abandon_reason"
type = "string"
initial = ""

# ============================================================================
# Idle — between jobs. Capture identity is recorded here once.
# ============================================================================

[[action]]
name = "RecordCapture"
kind = "input"
from = ["Idle"]
params = ["session_id", "trajectory_id", "spec_version", "harness"]
guard = [{ type = "is_false", var = "capture_recorded" }]
effect = [{ type = "set_bool", var = "capture_recorded", value = "true" }]
hint = "Store the capture identity this run will carry on every Temper call. One-shot. Does not claim a job."

[[action]]
name = "AcceptResearchJob"
kind = "input"
from = ["Idle"]
to = "Researching"
params = ["job_id", "query_id"]
guard = [
  { type = "is_true", var = "capture_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Running"], required = true },
]
effect = [
  { type = "set_bool", var = "query_recorded", value = "false" },
  { type = "set_bool", var = "direction_recorded", value = "false" },
  { type = "set_bool", var = "language_recorded", value = "false" },
  { type = "set_bool", var = "look_recorded", value = "false" },
]
hint = "Pick up the live source_search CurationJob the pipeline already started. The job must be Running. The curator then calls CurationJob.SpawnDirection and CurationJob.CompleteResearch on that job — those actions live on CurationJob, not here."

[[action]]
name = "AcceptSynthesizeJob"
kind = "input"
from = ["Idle"]
to = "Synthesizing"
params = ["job_id", "query_id", "direction_id"]
guard = [
  { type = "is_true", var = "capture_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Running"], required = true },
]
effect = [
  { type = "set_bool", var = "query_recorded", value = "false" },
  { type = "set_bool", var = "direction_recorded", value = "false" },
  { type = "set_bool", var = "language_recorded", value = "false" },
  { type = "set_bool", var = "look_recorded", value = "false" },
]
hint = "Pick up the live synthesize CurationJob the pipeline queued for one CurationDirection. The job must be Running. Writing the language and SubmitForReview live on DesignLanguage; CompleteSynthesis lives on CurationJob."

# ============================================================================
# Researching — holding one source_search job.
# ============================================================================

[[action]]
name = "RecordResearchQuery"
kind = "input"
from = ["Researching"]
params = ["query_id"]
guard = [
  { type = "is_false", var = "query_recorded" },
  { type = "cross_entity_state", entity_type = "CurationQuery", entity_id_source = "query_id", required_status = ["Researching"], required = true },
]
effect = [{ type = "set_bool", var = "query_recorded", value = "true" }]
hint = "Name the CurationQuery this search is answering. The query must actually be Researching. required = true: an empty ref cannot pretend a query exists."

[[action]]
name = "RecordDirectionSpawned"
kind = "input"
from = ["Researching"]
params = ["direction_id"]
guard = [
  { type = "is_true", var = "query_recorded" },
  { type = "cross_entity_state", entity_type = "CurationDirection", entity_id_source = "direction_id", required_status = ["Discovered", "Synthesizing"], required = true },
]
effect = [{ type = "set_bool", var = "direction_recorded", value = "true" }]
hint = "Record a CurationDirection that this job minted via CurationJob.SpawnDirection. The spawn itself is not this action. Callable after each spawn; the last recorded id is the one the ledger holds."

[[action]]
name = "FinishResearch"
kind = "input"
from = ["Researching"]
to = "Idle"
guard = [
  { type = "is_true", var = "query_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Finalizing", "Completed"], required = true },
]
hint = "Put the ledger down only after the source_search job has left Running — which means CurationJob.CompleteResearch (or Fail) already committed on the job. The actor cannot declare research finished while the job is still Running."

# ============================================================================
# Synthesizing — holding one synthesize job for one direction.
# ============================================================================

[[action]]
name = "RecordSynthesizeQuery"
kind = "input"
from = ["Synthesizing"]
params = ["query_id"]
guard = [
  { type = "is_false", var = "query_recorded" },
  { type = "cross_entity_state", entity_type = "CurationQuery", entity_id_source = "query_id", required_status = ["Researching", "Synthesizing"], required = true },
]
effect = [{ type = "set_bool", var = "query_recorded", value = "true" }]
hint = "Name the CurationQuery whose fan-out produced this synthesize job."

[[action]]
name = "RecordDirection"
kind = "input"
from = ["Synthesizing"]
params = ["direction_id"]
guard = [
  { type = "is_true", var = "query_recorded" },
  { type = "is_false", var = "direction_recorded" },
  { type = "cross_entity_state", entity_type = "CurationDirection", entity_id_source = "direction_id", required_status = ["Synthesizing"], required = true },
]
effect = [{ type = "set_bool", var = "direction_recorded", value = "true" }]
hint = "Name the CurationDirection this synthesize job is answering. The direction must be Synthesizing."

[[action]]
name = "RecordLanguage"
kind = "input"
from = ["Synthesizing"]
params = ["design_language_id"]
guard = [
  { type = "is_true", var = "direction_recorded" },
  { type = "is_false", var = "language_recorded" },
  { type = "cross_entity_state", entity_type = "DesignLanguage", entity_id_source = "design_language_id", required_status = ["Draft", "UnderReview"], required = true },
]
effect = [{ type = "set_bool", var = "language_recorded", value = "true" }]
hint = "Name the DesignLanguage this job is writing. The language entity owns philosophy, tokens, embodiment, and SubmitForReview. This only binds the ledger to that id."

[[action]]
name = "RecordLook"
kind = "input"
from = ["Synthesizing"]
guard = [
  { type = "is_true", var = "language_recorded" },
  { type = "is_false", var = "look_recorded" },
]
effect = [{ type = "set_bool", var = "look_recorded", value = "true" }]
hint = "Assert that the current embodiment came back into context as images and was looked at. Writing a PNG is not this. Cleared by RecordSynthesizeFix so a look of old bytes cannot carry a finish."

[[action]]
name = "RecordSynthesizeFix"
kind = "input"
from = ["Synthesizing"]
params = ["fix_note"]
guard = [
  { type = "is_true", var = "language_recorded" },
  { type = "max_count", var = "revision_rounds", max = 12 },
]
effect = [
  { type = "increment", var = "revision_rounds" },
  { type = "set_bool", var = "look_recorded", value = "false" },
]
hint = "Record that the language bytes changed after a look. The write itself is DesignLanguage actions. This clears look_recorded so the next look is of the new bytes. Bounded at 12 (C19)."

[[action]]
name = "FinishSynthesize"
kind = "input"
from = ["Synthesizing"]
to = "Idle"
guard = [
  { type = "is_true", var = "query_recorded" },
  { type = "is_true", var = "direction_recorded" },
  { type = "is_true", var = "language_recorded" },
  { type = "is_true", var = "look_recorded" },
  { type = "cross_entity_state", entity_type = "CurationJob", entity_id_source = "job_id", required_status = ["Finalizing", "Completed"], required = true },
  { type = "cross_entity_state", entity_type = "DesignLanguage", entity_id_source = "design_language_id", required_status = ["UnderReview"], required = true },
]
hint = "Put the ledger down only after (1) CurationJob.CompleteSynthesis already committed and (2) the named DesignLanguage is UnderReview — which is only reachable through DesignLanguage.SubmitForReview. The actor cannot announce a finished synthesize of a Draft language."

# ============================================================================
# Give up
# ============================================================================

[[action]]
name = "Abandon"
kind = "input"
from = ["Researching", "Synthesizing"]
to = "Abandoned"
params = ["abandon_reason"]
hint = "End the hold without finishing. The job still has its own Fail path; this only ends the actor ledger."

[[state_timeout]]
state = "Researching"
after_seconds = 3600
on_timeout = "Abandon"
params = { abandon_reason = "CuratorAgent held a source_search job for 1h without finishing." }

[[state_timeout]]
state = "Synthesizing"
after_seconds = 7200
on_timeout = "Abandon"
params = { abandon_reason = "CuratorAgent held a synthesize job for 2h without finishing." }

# ============================================================================
# Invariants
# ============================================================================

[[invariant]]
name = "IdleHoldsNoLook"
when = ["Idle"]
assert = "!look_recorded"

[[invariant]]
name = "RevisionLoopBounded"
assert = "revision_rounds <= 12"

[[invariant]]
name = "AbandonedIsFinal"
when = ["Abandoned"]
assert = "no_further_transitions"

[[liveness]]
name = "WorkingEventuallyResolves"
from = ["Researching"]
reaches = ["Idle", "Abandoned"]
