# Deliberately wrong. TakeQuery enters ReadingQuery and there is no
# action back to Idle. Liveness says ReadingQuery eventually reaches
# Idle. The verifier must FAIL. Not a production spec.

[automaton]
name = "CuratorAgent"
states = ["Idle", "ReadingQuery"]
initial = "Idle"
allow_indefinite_states = ["Idle", "ReadingQuery"]

[[action]]
name = "TakeQuery"
from = ["Idle"]
to = "ReadingQuery"

[[liveness]]
name = "QueryEventuallyResolves"
from = ["ReadingQuery"]
reaches = ["Idle"]
