# ArtStyle — I/O Automaton Specification
#
# An engine-agnostic art-style RECIPE (not a folder of images): a Medium
# (illustration / photography / painting / print / 3d / collage), one portable
# paste-ready PromptTemplate made of observable aesthetic facts, per-slot
# SubjectRecipes (hero -> wide scene, empty-state -> single object, avatar ->
# portrait), optional ReferenceImages (examples only), and ProofShots rendered
# from the same prompt without style references.
#
# Generation is delegated downstream: Katagami stores one aesthetic prompt.
# Consumers may prepend content/palette facts, but never rewrite its aesthetics
# per model or depend on a reference image to make the style work.
#
# Lifecycle: Draft -> UnderReview -> Published -> Archived
#                         ^              |             |
#                         └──────────────┴─────────────┘ (Revise/Restore)
#
# Key invariants: can't Publish without medium + portable prompt + slot recipes
# + verified multi-model proof shots + verified thumbnail + rights/source basis
# + independent prompt review + credits + model provenance + quality review
# + public assets. Existing Published records can remain while the catalog is
# revalidated; every new Publish transition must satisfy the stronger guards.

[automaton]
name = "ArtStyle"
states = ["Draft", "UnderReview", "Published", "Archived"]
initial = "Draft"

allow_indefinite_states = ["Draft", "UnderReview", "Published", "Archived"]

# --- State Variables ---

[[state]]
name = "verification_job_id"
type = "string"
initial = ""

[[state]]
name = "has_medium"
type = "bool"
initial = "false"

[[state]]
name = "has_prompt_template"
type = "bool"
initial = "false"

[[state]]
name = "has_slot_recipes"
type = "bool"
initial = "false"

[[state]]
name = "has_reference_images"
type = "bool"
initial = "false"

[[state]]
name = "has_proof_shots"
type = "bool"
initial = "false"

[[state]]
name = "has_thumbnail"
type = "bool"
initial = "false"

[[state]]
name = "has_published_assets"
type = "bool"
initial = "false"

[[state]]
name = "review_status"
type = "string"
initial = "unreviewed"

[[state]]
name = "quality_review_passed"
type = "bool"
initial = "false"

[[state]]
name = "featured"
type = "bool"
initial = "false"

# The owner-curated allowlist a signed-out visitor may see. Independent of
# `featured` (a signed-in highlight only): an art style can be featured without
# being shown to visitors. The website + read MCP gate the anonymous portion on
# THIS flag; signed-in users still see the full catalog.
[[state]]
name = "shown_to_visitors"
type = "bool"
initial = "false"

# Shelf position for the anonymous visitor shelf, INDEPENDENT of display_order
# (which orders the signed-in featured/picks lead). Written only by
# SetVisitorVisibility; lower comes first.
[[state]]
name = "visitor_order"
type = "counter"
initial = 0

[[state]]
name = "display_order"
type = "counter"
initial = 0

[[state]]
name = "version"
type = "counter"
initial = 0

[[state]]
name = "fork_count"
type = "counter"
initial = 0

[[state]]
name = "usage_count"
type = "counter"
initial = 0

[[state]]
name = "has_credits"
type = "bool"
initial = "false"

[[state]]
name = "has_model_provenance"
type = "bool"
initial = "false"

[[state]]
name = "has_source_basis_review"
type = "bool"
initial = "false"

[[state]]
name = "has_prompt_review"
type = "bool"
initial = "false"

[[state]]
name = "has_portability_evidence"
type = "bool"
initial = "false"

# Taste embedding — the semantic vector and the model tag that partitions its
# space. Written by AttachTasteVector (the curation finalizer after quality
# review, or the backfill job). Declared as state so the kernel's [[vector]]
# access path can index them; empty until embedded.
[[state]]
name = "taste_vector"
type = "string"
initial = ""

[[state]]
name = "taste_vector_model"
type = "string"
initial = ""

# Style DNA — Jev's answers (0..1) to the library's descriptive question set,
# as a JSON object {question_id: probability}. style_dna_version names the
# question set + model so answers from different sets are never compared.
# Written by AttachStyleDna (the backfill job); empty until asked.
[[state]]
name = "style_dna"
type = "string"
initial = ""

[[state]]
name = "style_dna_version"
type = "string"
initial = ""

# ADR-0155: declared vector access path. The kernel maintains an exact-scan kNN
# index over taste_vector, partitioned by taste_vector_model (only same-model
# vectors ever compare), and serves it through Temper.Nearest(decl='taste',...).
[[vector]]
name = "taste"
property = "taste_vector"
model_property = "taste_vector_model"
dims = 384
metric = "cosine"

# --- Actions: Recipe Authoring (Draft & UnderReview) ---

[[action]]
name = "SetName"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_published_assets", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }, { type = "set_bool", var = "has_prompt_review", value = "false" }]
params = ["name", "slug"]
hint = "Set the art style name and URL-safe slug."

[[action]]
name = "SubmitArtStyle"
kind = "input"
from = ["Draft"]
effect = [
  { type = "set_bool", var = "has_medium", value = "true" },
  { type = "set_bool", var = "has_prompt_template", value = "true" },
  { type = "set_bool", var = "has_slot_recipes", value = "true" },
  { type = "set_bool", var = "has_proof_shots", value = "true" },
  { type = "set_bool", var = "has_thumbnail", value = "true" },
  { type = "set_bool", var = "has_credits", value = "true" },
  { type = "set_bool", var = "has_model_provenance", value = "true" },
  { type = "set_bool", var = "has_published_assets", value = "false" },
  { type = "set_bool", var = "quality_review_passed", value = "false" },
  { type = "set_bool", var = "has_source_basis_review", value = "false" },
  { type = "set_bool", var = "has_prompt_review", value = "false" },
  { type = "set_bool", var = "has_portability_evidence", value = "false" }
]
params = ["name", "slug", "medium", "prompt_template", "slot_recipes", "guidance", "reference_image_file_ids", "reference_manifest", "proof_shots_file_ids", "proof_shots_manifest", "thumbnail_file_id", "parent_ids", "lineage_type", "generation_number", "model_provenance", "credits", "source_basis", "prompt_review", "portability_report", "tags", "direction_id", "curator_notes"]
hint = "Contributor hot-path: author a COMPLETE art style in ONE call — name/medium/one paste-ready observable prompt/slot_recipes/guidance + six gallery outputs (four GPT Image 2.5, one Grok Image, one Nano Banana) in reference_manifest schema version 2 + contributor-supplied multi-model proof shots made without style references + thumbnail + lineage + model provenance + credits + source_basis + independent prompt_review + portability_report + direction_id. Katagami does not generate submission images. Leaves the entity in Draft. The finalizer validates the reports, files, and hashes, internally attests them, and alone may mark quality/publish. Files must already be Locked."


# The engine binds verification to this submitted entity. Contributors do not
# receive job creation or publication authority.
[[action.triggers]]
name = "submission_queues_art_style_verification"
kind = "entity"
principal = "curation-service"
target_entity = "CurationJob"
target_action = "VerifyArtStyleSubmission"

[action.triggers.params]
job_type = "synthesize_art_style"
completion_contract = "typed-v1"

[action.triggers.params_from]
art_style_ids = "Id"

[action.triggers.resolve_target]
type = "create"


[[action]]
name = "RecordVerificationJob"
kind = "internal"
from = ["Draft", "UnderReview", "Published", "Archived"]
params = ["verification_job_id"]
hint = "Record the engine-created verification job for contributor-visible submission tracking."


[[action]]
name = "SetMedium"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_medium", value = "true" }, { type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["medium"]
hint = "Set the medium: illustration | photography | painting | print | 3d | collage | mixed."

[[action]]
name = "SetPromptTemplate"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_prompt_template", value = "true" }, { type = "set_bool", var = "has_published_assets", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }, { type = "set_bool", var = "has_prompt_review", value = "false" }, { type = "set_bool", var = "has_portability_evidence", value = "false" }]
params = ["prompt_template"]
hint = "Set the one canonical, paste-ready aesthetic prompt. It must use observable instructions in the universal medium/material -> marks/edges -> tonal/shading -> color roles -> composition -> signature details -> exclusions order, contain no placeholders or catalog-name imitation, include exclusions inline, and remain unchanged across image models. Changing it invalidates prompt review and portability evidence."

[[action]]
name = "SetSlotRecipes"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_slot_recipes", value = "true" }, { type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["slot_recipes"]
hint = "Set per-slot subject recipes as JSON (e.g. hero -> 'wide establishing scene', empty-state -> 'single friendly object', avatar -> 'portrait bust')."

[[action]]
name = "SetGuidance"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["guidance"]
hint = "Set usage guidance (do's, don'ts, what subjects suit this style, when to avoid it)."

# --- Actions: Display Gallery Images (not style-reference inputs) ---

[[action]]
name = "AttachReferenceImages"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_reference_images", value = "true" }, { type = "set_bool", var = "has_published_assets", value = "false" }, { type = "set_bool", var = "has_source_basis_review", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["reference_image_file_ids", "reference_manifest"]
hint = "Attach six ordered gallery File ids plus reference_manifest schema version 2: four GPT Image 2.5, one Grok Image, one Nano Banana, with distinct Locked file bytes, exact model IDs, prompt hashes and real provider request IDs. The first gallery File is the thumbnail. These are display outputs, not required style-reference inputs. Portability proof remains separate. Published styles must Revise first, only when the complete replacement is ready."

# --- Actions: Proof Shots (canonical subjects rendered in-style) ---

[[action]]
name = "AttachProofShots"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_proof_shots", value = "true" }, { type = "set_bool", var = "has_published_assets", value = "false" }, { type = "set_bool", var = "has_source_basis_review", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }, { type = "set_bool", var = "has_portability_evidence", value = "false" }]
params = ["proof_shots_file_ids", "proof_shots_manifest"]
hint = "Attach two or four contributor-supplied proof shots: two distinct edit models using the same one or two sources. Choose fresh subjects and compositions for each style from human portrait, non-human living subject, still-life/object, and landscape/environment roles; do not reuse recurring catalog fixtures. Two-source sets use distinct primary roles and source media. Every item carries a generation record binding exact imported source/output file ids, byte hashes and canonical prompt hash. The finalizer requires every source and output File Locked and hashes all files. Each case must preserve recognizable content and fully replace source medium, with medium/material and depiction grammar scoring 2/2. Katagami validates evidence but never invokes an image provider."

# --- Actions: Thumbnail / Public Assets ---

[[action]]
name = "AttachThumbnail"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_thumbnail", value = "true" }, { type = "set_bool", var = "has_published_assets", value = "false" }]
params = ["thumbnail_file_id"]
hint = "Attach or update the static gallery thumbnail (representative reference shot). The Publish/SubmitForReview cross_entity_state guards require the referenced thumbnail File to be Ready/Locked."

[[action]]
name = "AttachVerifiedThumbnail"
kind = "internal"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_thumbnail", value = "true" }, { type = "set_bool", var = "has_published_assets", value = "false" }]
params = ["thumbnail_file_id"]
hint = "Attach a thumbnail already validated by a backfill job. Published styles must Revise first."

[[action]]
name = "AttachPublishedAssets"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
effect = [{ type = "set_bool", var = "has_published_assets", value = "true" }]
params = ["thumbnail_asset_id", "thumbnail_asset_url", "reference_assets"]
hint = "Curation-service callback: attach immutable public artifact URLs from the generic Temper publish-artifact flow. Cedar denies contributors. `reference_assets` is a JSON map of optional example file id -> public URL. PawFS file ids remain the governed source."

[[action]]
name = "AttachTasteVector"
kind = "internal"
from = ["Draft", "UnderReview", "Published"]
params = ["taste_vector", "taste_vector_model"]
hint = "Attach the semantic taste embedding computed from this entity's canonical taste document. taste_vector is a JSON float array; taste_vector_model identifies the embedding model so mixed-model vectors are never compared. Written by the curation finalizer or the backfill job."

[[action]]
name = "AttachStyleDna"
kind = "internal"
from = ["Draft", "UnderReview", "Published"]
params = ["style_dna", "style_dna_version"]
hint = "Attach the style DNA: a JSON object of descriptive question id -> probability (0..1) answered by a System One model over this entity's canonical description. style_dna_version identifies the question set and model (e.g. dna-v1/jev-1.13.0) so mixed sets are never compared. Descriptive only — never a quality judgment. Written by the backfill job."

[[action]]
name = "AttachComputedFacets"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
params = ["search_blob"]
hint = "Curation-service callback: attach the precomputed lowercase search blob (name + tags + descriptive fields) so the catalog can be searched case-insensitively server-side under keyset pagination. Cedar denies contributors."

# --- Actions: Classification ---

[[action]]
name = "SetTaxonomy"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
params = ["taxonomy_ids"]
hint = "Assign taxonomy categories to this art style."

[[action]]
name = "SetTags"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
params = ["tags"]
hint = "Set freeform tags for discovery and search."

[[action]]
name = "SetCredits"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_credits", value = "true" }, { type = "set_bool", var = "has_source_basis_review", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["credits"]
hint = "Credit every attributable artist, movement, studio, or tradition as JSON [{name,kind,note}]. Artist credits require a matching public-domain or licensed source_basis entry. Published styles must Revise first because changing credits invalidates the rights review."

[[action]]
name = "SetModelProvenance"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "has_model_provenance", value = "true" }, { type = "set_bool", var = "has_prompt_review", value = "false" }, { type = "set_bool", var = "has_portability_evidence", value = "false" }, { type = "set_bool", var = "quality_review_passed", value = "false" }]
params = ["model_provenance"]
hint = "Record which AI models produced this art style. JSON {style:{model,provider}, source:{model,provider}, images:{model,provider,tool}}: the prompt author, the source reviewer, and the default sample-image engine. Per-image model truth lives in manifest items. Changing provenance invalidates review evidence; Published styles must Revise first."

[[action]]
name = "SetReviewEvidence"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
effect = [{ type = "set_bool", var = "has_source_basis_review", value = "false" }, { type = "set_bool", var = "has_prompt_review", value = "false" }, { type = "set_bool", var = "has_portability_evidence", value = "false" }]
params = ["source_basis", "prompt_review", "portability_report"]
hint = "Store candidate structured review evidence and clear prior attestations. The independent LLM performs semantic contradiction and dimension-assignment review; its seven substantive prompt clauses must follow the canonical dimension order. Only the finalizer may call AttachArtStyleReview after universal mechanical verification; Published records remain visible but their prompt/remix is quarantined during revalidation."

[[action]]
name = "AttachArtStyleReview"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
effect = [
  { type = "set_bool", var = "has_source_basis_review", value = "true" },
  { type = "set_bool", var = "has_prompt_review", value = "true" },
  { type = "set_bool", var = "has_portability_evidence", value = "true" }
]
params = ["source_basis", "prompt_review", "portability_report"]
hint = "Curation-service attestation after the WASM finalizer validates the exact prompt, source/rights basis, independent contradiction review, and per-model portability evidence. Cedar denies contributors; contributor-supplied reports alone never satisfy publication."

[[action]]
name = "SetFeatured"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
params = ["featured", "display_order"]
hint = "Highlight this art style for signed-in users and set display order for gallery sorting. Featured is a highlight only; it does NOT decide visitor visibility — use SetVisitorVisibility for that."

[[action]]
name = "SetVisitorVisibility"
kind = "input"
from = ["Draft", "UnderReview", "Published"]
params = ["shown_to_visitors", "visitor_order"]
hint = "Put this art style on the signed-out visitor shelf (shown_to_visitors=true) or take it off (false). This is the only flag that decides what a not-logged-in visitor sees on the website and the read MCP; signed-in users always see the full catalog. Independent of featured. visitor_order sets the shelf position (lower first), independent of display_order/featured; writing it here never changes the featured flag or the featured lead order."

[[action]]
name = "AddCuratorNotes"
kind = "input"
from = ["Draft", "UnderReview"]
params = ["curator_notes"]
hint = "Add curator feedback notes to a draft or under-review art style."

[[action]]
name = "SetSources"
kind = "input"
from = ["Draft", "UnderReview"]
params = ["source_ids"]
hint = "Link DesignSource entities that informed this art style."

# --- Actions: Lineage ---

[[action]]
name = "SetLineage"
kind = "input"
from = ["Draft"]
params = ["parent_ids", "lineage_type", "generation_number"]
hint = "Set lineage: parent_ids=[] for originals, single parent for evolution, multiple for remix."

# --- Actions: Review Lifecycle ---

[[action]]
name = "SubmitForReview"
kind = "input"
from = ["Draft"]
to = "UnderReview"
guard = [{ type = "is_true", var = "has_medium" }, { type = "is_true", var = "has_prompt_template" }, { type = "is_true", var = "has_proof_shots" }, { type = "is_true", var = "has_thumbnail" }, { type = "cross_entity_state", entity_type = "File", entity_id_source = "thumbnail_file_id", required_status = ["Ready", "Locked"] }]
hint = "Curation-service callback after the WASM finalizer verifies every proof file, generation chain, and report. Requires medium, one portable prompt, two or four proof shots from two distinct models, and a Ready/Locked thumbnail. Cedar denies contributors. Optional example references are not a prerequisite. Proof readiness stays in WASM, which streams and hashes every locked source and output."

[[action]]
name = "Publish"
kind = "input"
from = ["UnderReview"]
to = "Published"
guard = [{ type = "is_true", var = "has_medium" }, { type = "is_true", var = "has_prompt_template" }, { type = "is_true", var = "has_slot_recipes" }, { type = "is_true", var = "has_proof_shots" }, { type = "is_true", var = "has_thumbnail" }, { type = "is_true", var = "has_credits" }, { type = "is_true", var = "has_model_provenance" }, { type = "is_true", var = "has_source_basis_review" }, { type = "is_true", var = "has_prompt_review" }, { type = "is_true", var = "has_portability_evidence" }, { type = "is_true", var = "quality_review_passed" }, { type = "is_true", var = "has_published_assets" }, { type = "cross_entity_state", entity_type = "File", entity_id_source = "thumbnail_file_id", required_status = ["Ready", "Locked"] }]
effect = [{ type = "increment", field = "version" }]
hint = "Curation-service callback after finalizer attestation. Cedar denies contributors. Requires medium, one portable prompt, slot recipes, multi-model proof shots, thumbnail, credits, model provenance, source/rights review, independent prompt review, per-model portability evidence, quality review, and public assets. Optional example references are not required."

[[action]]
name = "Revise"
kind = "input"
from = ["Published"]
to = "UnderReview"
params = ["curator_notes"]
hint = "Pull a published art style back for revision with stated rationale."

[[action]]
name = "Archive"
kind = "internal"
from = ["Draft", "UnderReview", "Published"]
to = "Archived"
params = ["curator_notes"]
hint = "Archive a malformed, test, superseded, or published art style while preserving a governed restore path."

[[action]]
name = "Restore"
kind = "input"
from = ["Archived"]
to = "UnderReview"
params = ["curator_notes"]
hint = "Restore an archived art style into review so the finalizer can re-verify artifacts and publish through normal guards."

# --- Actions: Quality & Usage Signals ---

[[action]]
name = "UpdateQuality"
kind = "input"
from = ["UnderReview", "Published"]
params = ["quality_score", "review_status"]
hint = "Update quality score and/or review status (unreviewed, reviewed, needs_revision)."

[[action]]
name = "MarkQualityPassed"
kind = "input"
from = ["UnderReview", "Published"]
effect = [{ type = "set_bool", var = "quality_review_passed", value = "true" }]
params = []
hint = "Curation-service callback after finalizer-side artifact and state validation. Cedar denies contributors."

[[action]]
name = "IncrementUsage"
kind = "input"
from = ["Published"]
effect = "increment usage_count"
hint = "Record that a remix or agent used this art style."

[[action]]
name = "IncrementFork"
kind = "input"
from = ["Published"]
effect = "increment fork_count"
hint = "Record that a child art style was forked from this one."


[[action]]
name = "SetCreator"
kind = "input"
from = ["Draft", "UnderReview"]
params = ["creator_sub", "creator_email", "creator_name"]
hint = "Attribute this entity to the human account that owns the submission (Google identity from katagami.ai): stable subject id, email, display name. Set by the contribution front door on create — agents act, humans own."

[[action]]
name = "ReturnToDraft"
kind = "input"
from = ["UnderReview"]
to = "Draft"
params = ["curator_notes"]
hint = "Send a submission back to Draft: a curator rejecting with feedback, or the owning human withdrawing it before review. Notes are readable by the contributor via submission_status."

# --- Output Actions ---

[[action]]
name = "ArtStylePublishedEvent"
kind = "output"
hint = "Emitted when an art style is published."

[[action]]
name = "ArtStyleArchivedEvent"
kind = "output"
hint = "Emitted when an art style is archived."

# --- Safety Invariants ---

[[invariant]]
name = "PublishedRequiresMedium"
when = ["Published"]
assert = "has_medium"

[[invariant]]
name = "PublishedRequiresPromptTemplate"
when = ["Published"]
assert = "has_prompt_template"

[[invariant]]
name = "PublishedRequiresSlotRecipes"
when = ["Published"]
assert = "has_slot_recipes"

[[invariant]]
name = "PublishedRequiresProofShots"
when = ["Published"]
assert = "has_proof_shots"

[[invariant]]
name = "PublishedRequiresThumbnail"
when = ["Published"]
assert = "has_thumbnail"

[[invariant]]
name = "PublishedRequiresPublicAssets"
when = ["Published"]
assert = "has_published_assets"

[[invariant]]
name = "PublishedRequiresQualityReview"
when = ["Published"]
assert = "quality_review_passed"

[[invariant]]
name = "PublishedRequiresCredits"
when = ["Published"]
assert = "has_credits"

[[invariant]]
name = "PublishedRequiresModelProvenance"
when = ["Published"]
assert = "has_model_provenance"
