# NarrativeStructure I/O automaton specification
#
# NarrativeStructure records a reusable instruction for arranging a complete
# work before drafting, together with alternate names, ordered movements, named
# works, citations, and optional encyclopedia cell IDs. It omits copies of the
# works.
#
# `movements` has two valid JSON forms. A fixed structure uses
# {kind: "fixed", parts: [{position, name}]}. A variable structure uses
# {kind: "rule", rule, example: [{position, name}]}. The fixed form records
# methods such as Freytag's five named parts. The rule form records methods with
# variable unit counts, such as ring composition and hypertext.
#
# The finalizer sets `structure_verified` after it checks:
# - a non-empty name, slug, and instruction
# - aliases encoded as a JSON array
# - a valid movement form with an ordered non-empty sequence
# - at least two named exemplars
# - at least one cited source with public_domain or cited_and_paraphrased
#   handling
# - encyclopedia cell IDs that resolve
# Ordered movements provide an outline instruction, and two exemplars show use
# across multiple works. Every authored change clears `structure_verified`, and
# only System or the exact WASM runtime may set it.
#
# NarrativeStructure records citations and named works. It excludes the
# corpus-specific WritingStyle fields for consent attestation, license checks,
# mechanical bands, replication samples, portable documents, thumbnails, and
# public assets.
#
# The lifecycle is Draft -> UnderReview -> Published -> Archived.
#                         ^              |             |
#                         +--------------+-------------+ (Revise/Restore)

[automaton]
name = "NarrativeStructure"
states = ["Draft", "UnderReview", "Published", "Archived"]
initial = "Draft"
allow_indefinite_states = ["Draft", "UnderReview", "Published", "Archived"]

[[state]]
name = "has_identity"
type = "bool"
initial = "false"

[[state]]
name = "has_instruction"
type = "bool"
initial = "false"

[[state]]
name = "has_movements"
type = "bool"
initial = "false"

[[state]]
name = "has_exemplars"
type = "bool"
initial = "false"

[[state]]
name = "has_sources"
type = "bool"
initial = "false"

[[state]]
name = "structure_verified"
type = "bool"
initial = "false"

[[state]]
name = "version"
type = "counter"
initial = 0

# Authoring transitions write authored fields and clear verification.

[[action]]
name = "SetIdentity"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [
  { type = "set_bool", var = "has_identity", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["name", "slug", "aliases"]
hint = "Set the canonical name, stable URL slug, and JSON list of alternate names. Aliases may use any script."

[[action]]
name = "SetInstruction"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [
  { type = "set_bool", var = "has_instruction", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["instruction"]
hint = "Set one compositional instruction that an agent can apply before the work exists."

[[action]]
name = "SetMovements"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [
  { type = "set_bool", var = "has_movements", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["movements"]
hint = "Set ordered movements as JSON. Use {kind:'fixed',parts:[{position,name}]} for mandatory named parts. Use {kind:'rule',rule,example:[{position,name}]} when the method permits a variable number of units. Positions start at 1 and remain consecutive."

[[action]]
name = "SetExemplars"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [
  { type = "set_bool", var = "has_exemplars", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["exemplars"]
hint = "Set a JSON list of named works as {work,creator?}. Store names only. The verifier requires at least two works."

[[action]]
name = "SetSources"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [
  { type = "set_bool", var = "has_sources", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["sources"]
hint = "Set a JSON list of citations as {title,url,handling}. handling is public_domain or cited_and_paraphrased. Store no copied source text."

[[action]]
name = "SetEncyclopediaLinks"
kind = "input"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "structure_verified", value = "false" }]
params = ["encyclopedia_cell_ids"]
hint = "Set the JSON list of existing encyclopedia cell IDs for matching genre or form records. An empty list is valid. The verifier resolves every non-empty ID."

[[action]]
name = "SubmitNarrativeStructure"
kind = "input"
from = ["Draft"]
effect = [
  { type = "set_bool", var = "has_identity", value = "true" },
  { type = "set_bool", var = "has_instruction", value = "true" },
  { type = "set_bool", var = "has_movements", value = "true" },
  { type = "set_bool", var = "has_exemplars", value = "true" },
  { type = "set_bool", var = "has_sources", value = "true" },
  { type = "set_bool", var = "structure_verified", value = "false" }
]
params = ["name", "slug", "aliases", "instruction", "movements", "exemplars", "sources", "encyclopedia_cell_ids"]
hint = "Write one complete Draft record and set the authored fields and their presence flags. Submit the record for review before the finalizer verifies it."

# Trusted finalization records the verification result.

[[action]]
name = "MarkStructureVerified"
kind = "internal"
from = ["Draft", "UnderReview"]
effect = [{ type = "set_bool", var = "structure_verified", value = "true" }]
params = ["verification_report"]
hint = "The finalizer requires non-empty name, slug, and instruction, parses aliases as a JSON array, and validates the closed movement union with an ordered non-empty sequence. It also requires at least two named exemplars and at least one source with public_domain or cited_and_paraphrased handling, resolves every encyclopedia cell ID, records the verification report, and sets structure_verified."

# Review lifecycle.

[[action]]
name = "SubmitForReview"
kind = "internal"
from = ["Draft"]
to = "UnderReview"
effect = [{ type = "set_bool", var = "structure_verified", value = "false" }]
guard = [
  { type = "is_true", var = "has_identity" },
  { type = "is_true", var = "has_instruction" },
  { type = "is_true", var = "has_movements" },
  { type = "is_true", var = "has_exemplars" },
  { type = "is_true", var = "has_sources" }
]
hint = "Submit a complete authored record for curator review and clear any earlier verification. The finalizer verifies the stored UnderReview record before publishing it."

[[action]]
name = "Publish"
kind = "internal"
from = ["UnderReview"]
to = "Published"
guard = [
  { type = "is_true", var = "has_identity" },
  { type = "is_true", var = "has_instruction" },
  { type = "is_true", var = "has_movements" },
  { type = "is_true", var = "has_exemplars" },
  { type = "is_true", var = "has_sources" },
  { type = "is_true", var = "structure_verified" }
]
effect = [{ type = "increment", var = "version" }]
hint = "Publish only after the finalizer verifies the movement model, named exemplars, citations, and encyclopedia links."

[[action]]
name = "Revise"
kind = "input"
from = ["Published"]
to = "UnderReview"
effect = [{ type = "set_bool", var = "structure_verified", value = "false" }]
params = ["curator_notes"]
hint = "Return a published record to review and require fresh verification."

[[action]]
name = "Archive"
kind = "internal"
from = ["Draft", "UnderReview", "Published"]
to = "Archived"
params = ["curator_notes"]
hint = "Archive a malformed, superseded, or retired record."

[[action]]
name = "Restore"
kind = "input"
from = ["Archived"]
to = "UnderReview"
effect = [{ type = "set_bool", var = "structure_verified", value = "false" }]
params = ["curator_notes"]
hint = "Restore an archived record to review and require fresh verification."

[[action]]
name = "NarrativeStructurePublishedEvent"
kind = "output"
hint = "The automaton emits this event when a narrative structure enters Published."

[[action]]
name = "NarrativeStructureArchivedEvent"
kind = "output"
hint = "The automaton emits this event when a narrative structure enters Archived."

# Published rows retain the same requirements as the Publish guard.

[[invariant]]
name = "PublishedRequiresIdentity"
when = ["Published"]
assert = "has_identity"

[[invariant]]
name = "PublishedRequiresInstruction"
when = ["Published"]
assert = "has_instruction"

[[invariant]]
name = "PublishedRequiresMovements"
when = ["Published"]
assert = "has_movements"

[[invariant]]
name = "PublishedRequiresExemplars"
when = ["Published"]
assert = "has_exemplars"

[[invariant]]
name = "PublishedRequiresSources"
when = ["Published"]
assert = "has_sources"

[[invariant]]
name = "PublishedRequiresVerifiedStructure"
when = ["Published"]
assert = "structure_verified"
