[package]
name = "validate_encyclopedia_cell"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
temper-wasm-sdk = { git = "https://github.com/nerdsane/temper.git", rev = "711f6cfa61534613394ed40b536faf318a79fc48" }
